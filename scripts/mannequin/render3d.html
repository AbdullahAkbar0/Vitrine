<!doctype html>
<html>
<head><meta charset="utf-8"><title>Mannequin renderer</title>
<style>html,body{margin:0;background:#888}canvas{display:block}</style>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/",
  "three-subdivide": "/node_modules/three-subdivide/build/index.module.js"
} }
</script>
</head>
<body>
<script type="module">
// Renders a mannequin body (built by mesh.py) as a matte studio figure.
// Soft light comes from averaging many shadow-casting lights placed around the figure,
// which gives real soft shadows and ambient occlusion.
import * as THREE from 'three'
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js'
import { LoopSubdivision } from 'three-subdivide'

const cache = {}
async function loadBody(url, subdivide) {
  const key = url + subdivide
  if (cache[key]) return cache[key]
  const data = await (await fetch(url)).json()
  let geo = new THREE.BufferGeometry()
  geo.setAttribute('position', new THREE.Float32BufferAttribute(data.positions, 3))
  geo.setIndex(data.indices)
  if (subdivide) {
    geo = LoopSubdivision.modify(geo, subdivide, { split: false, uvSmooth: false, preserveEdges: false, flatOnly: false })
    geo.deleteAttribute('normal')
    if (geo.getAttribute('uv')) geo.deleteAttribute('uv')
    geo = mergeVertices(geo, 1e-5)
  }
  geo.computeVertexNormals()
  cache[key] = geo
  return geo
}

// The studio: how bright the surroundings are in each direction (camera space: +z toward the viewer).
function studio(d) {
  const lobe = (c, sigma) => {
    const n = c.clone().normalize()
    const a = Math.acos(Math.max(-1, Math.min(1, d.dot(n))))
    return Math.exp(-(a * a) / (2 * sigma * sigma))
  }
  let w = 0
  w += 2.4 * lobe(new THREE.Vector3(-0.55, 0.6, 0.65), 0.42) // key softbox, upper left
  w += 0.75 * lobe(new THREE.Vector3(0.8, 0.2, 0.6), 0.5) // fill, right
  w += 0.45 * lobe(new THREE.Vector3(0.75, 0.35, -0.55), 0.3) // rim
  w += 0.45 * lobe(new THREE.Vector3(-0.75, 0.35, -0.55), 0.3)
  w += 0.3 * Math.max(0, d.y) // ceiling
  if (d.z > -0.2) w += 0.22 // room
  if (d.y < 0) w = w * 0.35 + 0.1 // floor bounce
  // little light from the far sides: it would print the hands' shadows onto the legs
  const side = Math.min(1, Math.max(0, (Math.abs(d.x) - 0.62) / 0.3))
  w *= 1 - 0.85 * side
  return w
}

window.renderFigure = async function (o) {
  const { url, width, height, frame, yaw = 0, mode = 'beauty', inflate = 0, samples = 72, ss = 2, subdivide = 1, stand = true, exposure = 1 } = o
  const W = width * ss
  const H = height * ss
  const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true, preserveDrawingBuffer: true })
  renderer.setPixelRatio(1)
  renderer.setSize(W, H)
  renderer.outputColorSpace = THREE.LinearSRGBColorSpace
  renderer.toneMapping = THREE.NoToneMapping
  renderer.setClearColor(0x000000, 0)
  renderer.shadowMap.enabled = true
  renderer.shadowMap.type = THREE.VSMShadowMap
  document.body.replaceChildren(renderer.domElement)

  const scene = new THREE.Scene()
  let geo = await loadBody(url, subdivide)
  if (inflate) {
    geo = geo.clone()
    const p = geo.getAttribute('position')
    const n = geo.getAttribute('normal')
    for (let i = 0; i < p.count; i++) p.setXYZ(i, p.getX(i) + n.getX(i) * inflate, p.getY(i) + n.getY(i) * inflate, p.getZ(i) + n.getZ(i) * inflate)
    geo.computeVertexNormals()
  }
  const body = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: 0xffffff }))
  body.rotation.y = yaw
  body.castShadow = body.receiveShadow = true
  scene.add(body)
  if (stand && mode === 'beauty') {
    const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.27, 0.285, 0.03, 96), new THREE.MeshLambertMaterial({ color: 0xf2f2f2 }))
    disc.position.y = -0.016
    disc.castShadow = disc.receiveShadow = true
    scene.add(disc)
  }
  const cam = new THREE.OrthographicCamera(frame[0], frame[1], frame[3], frame[2], 0.1, 20)
  cam.position.set(0, 0, 6)
  cam.lookAt(0, 0, 0)

  const light = new THREE.DirectionalLight(0xffffff, Math.PI) // Lambert divides by pi
  light.castShadow = true
  light.shadow.mapSize.set(2048, 2048)
  Object.assign(light.shadow.camera, { left: -1.3, right: 1.3, top: 1.3, bottom: -1.3, near: 0.5, far: 12 })
  light.shadow.bias = -0.0006
  light.shadow.normalBias = 0.02
  light.shadow.radius = 9
  light.shadow.blurSamples = 16
  light.target.position.set(0, 0.95, 0)
  scene.add(light, light.target)

  const gl = renderer.getContext()
  const buf = new Uint8Array(W * H * 4)
  const acc = new Float32Array(W * H)
  const alpha = new Float32Array(W * H)
  let total = 0
  const golden = Math.PI * (3 - Math.sqrt(5))
  for (let i = 0; i < samples; i++) {
    const y = 1 - ((i + 0.5) / samples) * 2
    const r = Math.sqrt(1 - y * y)
    const d = new THREE.Vector3(Math.cos(golden * i) * r, y, Math.sin(golden * i) * r)
    const w = studio(d)
    if (w < 0.03) continue
    light.position.copy(d).multiplyScalar(6).add(light.target.position)
    renderer.render(scene, cam)
    gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, buf)
    for (let k = 0; k < W * H; k++) acc[k] += w * buf[k * 4]
    if (total === 0) for (let k = 0; k < W * H; k++) alpha[k] = buf[k * 4 + 3]
    total += w
    if (i % 8 === 0) await new Promise((res) => setTimeout(res, 0))
  }

  // downsample (anti-aliasing) and tone
  const out = document.createElement('canvas')
  out.width = width
  out.height = height
  const ctx = out.getContext('2d')
  const img = ctx.createImageData(width, height)
  const albedo = mode === 'beauty' ? [0.8, 0.8, 0.815] : [1, 1, 1]
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      let e = 0
      let a = 0
      for (let j = 0; j < ss; j++) {
        for (let i = 0; i < ss; i++) {
          const k = (H - 1 - (y * ss + j)) * W + x * ss + i
          const al = alpha[k] / 255
          e += (acc[k] / total / 255) * al
          a += al
        }
      }
      const o4 = (y * width + x) * 4
      if (a <= 0) continue
      e = (e / a) * exposure
      for (let c = 0; c < 3; c++) {
        const lin = Math.min(1, albedo[c] * e)
        img.data[o4 + c] = Math.round(255 * (mode === 'beauty' ? Math.pow(lin, 1 / 2.2) : lin))
      }
      img.data[o4 + 3] = Math.round((255 * a) / (ss * ss))
    }
  }
  ctx.putImageData(img, 0, 0)
  renderer.dispose()
  document.body.replaceChildren(out)
  return out.toDataURL('image/png')
}
</script>
</body>
</html>
